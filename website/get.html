<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<!--
  The one place the website's Microsoft Store link lives: every download
  button on the site links to this page (get.html), which forwards to the Store.
  Before publishing the site, replace REPLACE-WITH-STORE-ID in BOTH links below
  with K8Board's Store ID (Partner Center → K8Board → Product management →
  Product identity; it looks like 9NXXXXXXXXXX).
-->
<meta http-equiv="refresh" content="0; url=https://apps.microsoft.com/detail/REPLACE-WITH-STORE-ID" />
<title>Get K8Board</title>
<meta name="description" content="Get K8Board for Windows from the Microsoft Store." />
<link rel="icon" href="assets/icon.png" type="image/png" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --text: #1d1d1f; --text-dim: #6e6e73; --accent: #0066cc; --accent-hover: #0077ed;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --text: #f5f5f7; --text-dim: #a1a1a6; --accent: #2997ff; --accent-hover: #47a5ff; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
  main { max-width: 440px; text-align: center; }
  img { display: block; margin: 0 auto 20px; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 10px; }
  p { color: var(--text-dim); font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .btn { display: inline-block; background: var(--accent); color: #fff; font-size: 16px; padding: 11px 22px; border-radius: 980px; }
  .btn:hover { background: var(--accent-hover); text-decoration: none; }
  .back { display: inline-block; margin-top: 22px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="assets/icon.png" width="64" height="64" alt="" />
  <h1>Opening the Microsoft Store…</h1>
  <p>K8Board for Windows 10 and 11 is installed and kept up to date by the Microsoft Store.</p>
  <a class="btn" href="https://apps.microsoft.com/detail/REPLACE-WITH-STORE-ID">Open K8Board in the Microsoft Store</a>
  <br />
  <a class="back" href="index.html">Back to k8dashboard.in</a>
</main>
</body>
</html>
