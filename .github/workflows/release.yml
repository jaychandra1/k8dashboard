name: Build & Release

# Build the KubePilot desktop app for macOS, Windows and Linux in parallel, then
# publish a GitHub Release on the PUBLIC repo jaychandra1/KubePilot (installers +
# SHA256SUMS.txt + CycloneDX SBOM) and push the Docker image to
# ghcr.io/jaychandra1/kubepilot. The source stays in this private repo.
#
# RELEASE_TOKEN is a fine-grained PAT scoped to jaychandra1/KubePilot
# with "Contents: Read and write" — store it as a secret on the `release`
# environment (or the repo). The release job fails early without it.
#
# GitHub artifact attestations are not available on private repos without
# GitHub Enterprise, so the attestation step is continue-on-error.
#
# Trigger it either way:
#   * push a version tag that matches the VERSION file (`git push origin v1.2.0`), or
#   * Actions -> Build & Release -> Run workflow, on `main` only; the tag is
#     `v<VERSION>` and is created at the current main commit.
# A tag that does not equal `v$(cat VERSION)` fails the run before anything is
# built, so a release can never carry a version the app itself doesn't report.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

# Never cancel a release that is already publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 1
  RELEASE_REPO: jaychandra1/KubePilot

jobs:
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag == VERSION
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and validate the release tag
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::VERSION file '$VERSION' is not semver"; exit 1; }
          EXPECTED="v${VERSION}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases may only be started from main (got $REF)"; exit 1
            fi
            TAG="$EXPECTED"
          else
            [ "$REF_TYPE" = "tag" ] || { echo "::error::unexpected ref type $REF_TYPE"; exit 1; }
            TAG="$REF_NAME"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "::error::Tag '$TAG' does not match VERSION file ('$EXPECTED'). Bump VERSION (npm run version:sync <ver>) and re-tag."; exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (VERSION=$VERSION)"

      # The app refuses updates that aren't signed with a key it trusts, so a
      # release is only built once the trust anchor is in place (the release
      # job then checks the secret matches it before signing).
      - name: Require a trusted release-signing key
        shell: bash
        run: |
          set -euo pipefail
          n="$(node --input-type=module -e "import('./lib/updater/keys.mjs').then((m) => console.log(m.RELEASE_PUBLIC_KEYS.length))")"
          if [ "$n" -lt 1 ]; then
            echo "::error::lib/updater/keys.mjs trusts no release-signing key. Run 'node scripts/release-signing-keygen.mjs' once, store the private key as the RELEASE_SIGNING_KEY secret of the 'release' environment ('gh secret set RELEASE_SIGNING_KEY --env release < <key file>') and commit lib/updater/keys.mjs."
            exit 1
          fi
          echo "lib/updater/keys.mjs trusts $n release-signing key(s)"

  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # Build every platform even if one fails, so a single flaky OS doesn't
      # block the others. Each matrix leg runs on its own runner in parallel.
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon, so the arm64 .dmg builds natively.
          - os: macos-14
            name: macOS (arm64)
            artifact: mac
          - os: windows-latest
            name: Windows (x64)
            artifact: windows
          - os: ubuntu-latest
            name: Linux (x64)
            artifact: linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # Lifecycle scripts stay off; the two things we need from them (the
      # Electron binary download and the node-pty native build) run explicitly.
      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty --foreground-scripts
          node node_modules/electron/install.js
          node scripts/fix-pty-helper.mjs

      - name: Install client dependencies
        run: npm ci --prefix client --ignore-scripts

      # Gate the release on the test suite — never ship a build whose tests fail.
      - name: Run tests
        run: npm test

      - name: Build & package
        # `npm run dist` builds the client and runs electron-builder for the
        # host OS with --publish never (Windows: the NSIS installer and the
        # Microsoft Store AppX); the release and store jobs below publish. No
        # GitHub token is exposed here.
        run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubepilot-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml

      # Microsoft Store package (AppX/MSIX). Unsigned on purpose: the Store
      # signs it with Microsoft's certificate after certification, and it only
      # installs through the Store — so it stays out of the GitHub release
      # (and SHA256SUMS). The `store` job below submits it.
      - name: Upload Microsoft Store package
        if: matrix.artifact == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-kubepilot-windows
          if-no-files-found: error
          retention-days: 30
          path: release/*.appx

  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Manual approval gate: this job targets the `release` environment, which has
    # required reviewers. After every platform builds, the workflow PAUSES here
    # until a reviewer approves it in the Actions run — then it publishes.
    # (Configure reviewers in Settings → Environments → release.)
    environment: release
    permissions:
      contents: write
      # For actions/attest-build-provenance (best effort, see below).
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # The SBOM describes the shipped dependency tree; install it (production
      # deps only, no scripts) so the generator sees resolved packages.
      - name: Install production dependencies for the SBOM
        shell: bash
        run: |
          npm ci --omit=dev --ignore-scripts
          npm ci --prefix client --omit=dev --ignore-scripts

      # Publishing happens on the PUBLIC repo, which needs a PAT — GITHUB_TOKEN
      # is scoped to this (source) repo only. Fail fast with instructions
      # instead of creating a release in the wrong place.
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::secrets.RELEASE_TOKEN is empty. Create a fine-grained personal access token (GitHub → Settings → Developer settings → Fine-grained tokens) with Repository access limited to ${RELEASE_REPO} and the permission 'Contents: Read and write', then add it as RELEASE_TOKEN under Settings → Environments → release (or Settings → Secrets and variables → Actions) on ${GITHUB_REPOSITORY}."
            exit 1
          fi
          echo "RELEASE_TOKEN is set; publishing to ${RELEASE_REPO}"

      # Fail before touching anything if the signing secret is missing or
      # doesn't match a key the app trusts (lib/updater/keys.mjs).
      - name: Require RELEASE_SIGNING_KEY
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs --check

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # The installers only — not the Store package (store-kubepilot-windows).
          pattern: kubepilot-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.dmg *.exe *.AppImage *.deb)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no installers found"; exit 1; }
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # SHA256SUMS.txt.sig: Ed25519 over "KubePilot release <version>\n" +
      # SHA256SUMS.txt. The in-app updater installs nothing without it.
      - name: Sign SHA256SUMS.txt
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/sign-release.mjs dist "$VERSION"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/kubepilot-${{ needs.verify.outputs.tag }}.cdx.json
          artifact-name: kubepilot-${{ needs.verify.outputs.tag }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Artifact attestations are not available on private repositories without
      # GitHub Enterprise (the persist API returns 404), so this is best effort:
      # it works automatically if the plan ever allows it and never blocks the release.
      - name: Attest build provenance (best effort)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig

      # Release body = the "## [<version>]" section of CHANGELOG.md, with a
      # one-line fallback when that section is missing.
      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ github.sha }}
          SRC: ${{ github.repository }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if [ -s notes.md ]; then
            echo "Using the CHANGELOG.md section for ${VERSION}"
          else
            echo "::warning::CHANGELOG.md has no '## [${VERSION}]' section — using a one-line release body"
            echo "KubePilot ${VERSION} — desktop installers for macOS (Apple Silicon), Windows and Linux." > notes.md
          fi
          {
            echo "# KubePilot ${VERSION}"
            echo
            cat notes.md
            echo
            echo "---"
            echo
            echo "Checksums are in \`SHA256SUMS.txt\`, signed with KubePilot's release key (\`SHA256SUMS.txt.sig\`, verified by the in-app updater); the CycloneDX SBOM is \`kubepilot-${TAG}.cdx.json\`."
            echo "Container image: \`ghcr.io/jaychandra1/kubepilot:${TAG}\`."
            echo "Built from \`${SRC}@${SHA:0:12}\`."
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: jaychandra1/KubePilot
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ needs.verify.outputs.tag }}
          # No target_commitish: KubePilot holds no source, so the tag is created
          # on its default branch (the repo must have at least one commit).
          name: KubePilot ${{ needs.verify.outputs.version }}
          draft: false
          make_latest: true
          generate_release_notes: false
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
            dist/*.cdx.json

  # ---------------------------------------------------------------------------
  # Docker image: each architecture is built on a NATIVE runner (no QEMU) and
  # pushed by digest; docker-manifest then tags one multi-arch image.
  #
  # Emulating arm64 with QEMU on an x64 runner made Node crash with SIGILL
  # ("qemu: uncaught target signal 4 (Illegal instruction)") during npm ci —
  # an intermittent fault of the QEMU that setup-qemu-action installs, not of
  # the app. Native arm64 runners (ubuntu-24.04-arm; private repos: billed per
  # minute after the free minutes) also build several times faster.
  docker:
    name: Docker image (${{ matrix.arch }})
    needs: [verify, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Same approval gate as before: both legs wait for the `release`
    # environment together with the GitHub Release job (one approval).
    # They only push untagged digests; nothing is tagged until docker-manifest.
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is pushed with GITHUB_TOKEN, so the GHCR package is created
      # under this (source) repo's owner. After the FIRST push: open the
      # `kubepilot` package on GHCR → Package settings → set visibility to
      # Public, and under "Manage Actions access / Connect repository" link it
      # to jaychandra1/KubePilot so the public repo shows the image.
      - name: Image name
        id: img
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/kubepilot" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          # metadata-action defaults source/url/documentation to the workflow's
          # own (private) repo; point them at the public KubePilot repo instead.
          labels: |
            org.opencontainers.image.title=KubePilot
            org.opencontainers.image.description=Browse and operate Kubernetes clusters from your kubeconfig — dashboards, logs, shell, topology, Helm, Argo CD, Security Center.
            org.opencontainers.image.source=https://github.com/jaychandra1/KubePilot
            org.opencontainers.image.url=https://github.com/jaychandra1/KubePilot
            org.opencontainers.image.documentation=https://github.com/jaychandra1/KubePilot#readme
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest (${{ matrix.platform }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.img.outputs.name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$DIGEST'"; exit 1; }
          mkdir -p "$DIR"
          touch "$DIR/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  docker-manifest:
    name: Publish Docker image (GHCR)
    # Runs only after both approved, successful architecture builds.
    needs: [verify, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        id: img
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/kubepilot" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest

      - name: Create the multi-arch image and push its tags
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.img.outputs.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          [ ${#digests[@]} -eq 2 ] || { echo "::error::expected 2 platform digests, got ${#digests[@]}"; exit 1; }
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          sources=()
          for d in "${digests[@]}"; do sources+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect the published image
        shell: bash
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"

  # ---------------------------------------------------------------------------
  # Microsoft Store: submit the AppX built above as a new submission of the
  # existing Store product, after the GitHub release is published. Off until
  # the repository variable MS_STORE_PRODUCT_ID is set — Microsoft requires
  # the FIRST submission to be made by hand in Partner Center (upload the
  # store-kubepilot-windows artifact there).
  #
  # Secrets of the `release` environment: MS_STORE_TENANT_ID,
  # MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET — a
  # Microsoft Entra ID app added in Partner Center (Account settings → User
  # management → Microsoft Entra applications) with the Manager role.
  # Certification then takes Microsoft a few days before the update is live.
  store:
    name: Submit to Microsoft Store
    needs: [verify, build, release]
    if: ${{ vars.MS_STORE_PRODUCT_ID != '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The package identity must be the one Partner Center reserved for the
      # product, or the submission is rejected.
      - name: Require the Partner Center identity in package.json
        shell: pwsh
        run: |
          $appx = (Get-Content package.json -Raw | ConvertFrom-Json).build.appx
          if ($appx.identityName -eq 'KubePilot.Desktop' -or $appx.publisher -eq 'CN=KubePilot') {
            Write-Output "::error::package.json build.appx still has the placeholder identity. Copy Package/Identity/Name, Package/Identity/Publisher and Package/Properties/PublisherDisplayName from Partner Center (Product management -> Product identity) into build.appx identityName, publisher and publisherDisplayName."
            exit 1
          }
          Write-Output "Package identity: $($appx.identityName) / $($appx.publisher)"

      - name: Download the Store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-kubepilot-windows
          path: store

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Submit to the Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              Write-Output "::error::secrets.MS_STORE_$name is not set on the 'release' environment."
              exit 1
            }
          }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem store -Filter *.appx | Select-Object -First 1
          if (-not $pkg) { Write-Output "::error::no .appx in the store-kubepilot-windows artifact"; exit 1 }
          msstore publish $pkg.FullName -id $env:PRODUCT_ID
          exit $LASTEXITCODE
