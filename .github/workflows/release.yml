name: Build & Release

# Build the K8Board desktop app for macOS, Windows and Linux in parallel, then
# publish a GitHub Release on the PUBLIC repo jaychandra1/K8Board (installers +
# SHA256SUMS.txt + CycloneDX SBOM) and push the Docker image to
# ghcr.io/jaychandra1/k8board. The source stays in this private repo.
#
# Publishing to jaychandra1/K8Board uses a short-lived GitHub App token when
# the repository variable RELEASE_APP_CLIENT_ID and the `release` environment
# secret RELEASE_APP_PRIVATE_KEY are set (an App installed on that repo only,
# with "Contents: Read and write"). Until then it falls back to RELEASE_TOKEN,
# a fine-grained PAT with the same scope. The release job fails early without
# either.
#
# A release is only built from a commit on main whose CI run (ci.yml: lint,
# tests, npm audit, CodeQL, Trivy, gitleaks) succeeded; the verify job waits
# for a CI run that is still going.
#
# The GHCR images are signed with cosign (keyless, Sigstore): verify with
#   cosign verify ghcr.io/jaychandra1/k8board:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/<this repo>/.github/workflows/release.yml@refs/'
#
# GitHub artifact attestations are not available on private repos without
# GitHub Enterprise, so the attestation step is continue-on-error.
#
# Trigger it either way:
#   * push a version tag that matches the VERSION file (`git push origin v1.2.0`), or
#   * Actions -> Build & Release -> Run workflow, on `main` only; the tag is
#     `v<VERSION>` and is created at the current main commit.
# A tag that does not equal `v$(cat VERSION)` fails the run before anything is
# built, so a release can never carry a version the app itself doesn't report.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

# Never cancel a release that is already publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: 1
  RELEASE_REPO: jaychandra1/K8Board

jobs:
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag == VERSION, main and green CI
    runs-on: ubuntu-latest
    # Mostly waiting for a CI run of the same commit that's still going.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the CI runs of the release commit
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # main's history, for the check below

      - name: Resolve and validate the release tag
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::VERSION file '$VERSION' is not semver"; exit 1; }
          EXPECTED="v${VERSION}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases may only be started from main (got $REF)"; exit 1
            fi
            TAG="$EXPECTED"
          else
            [ "$REF_TYPE" = "tag" ] || { echo "::error::unexpected ref type $REF_TYPE"; exit 1; }
            TAG="$REF_NAME"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "::error::Tag '$TAG' does not match VERSION file ('$EXPECTED'). Bump VERSION (npm run version:sync <ver>) and re-tag."; exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (VERSION=$VERSION)"

      # A version tag pushed on any other branch (or on a commit that never
      # went through review) is refused.
      - name: Require a commit on main
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "::error::origin/main is not available"; exit 1; }
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main. Merge it to main first, then tag the main commit."
            exit 1
          fi
          echo "$SHA is on main"

      # The release gate is the same as CI's, not weaker: a successful ci.yml
      # run for this exact commit. A run that's still going is waited for.
      - name: Require a successful CI run for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 110); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')"
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" >/dev/null; then
              echo "CI passed for $SHA: $(jq -r '[.[] | select(.conclusion == "success")][0].url' <<< "$runs")"
              exit 0
            fi
            if jq -e 'any(.[]; .status != "completed")' <<< "$runs" >/dev/null; then
              echo "CI for $SHA is still running; waiting ($attempt)…"
              sleep 30
              continue
            fi
            echo "::error::No successful CI run for $SHA. Runs: $(jq -c '[.[] | {conclusion, url}]' <<< "$runs"). Fix CI (or re-run it) on this commit, then release again."
            exit 1
          done
          echo "::error::CI for $SHA did not finish in time"
          exit 1

      # The app refuses updates that aren't signed with a key it trusts, so a
      # release is only built once the trust anchor is in place (the release
      # job then checks the secret matches it before signing).
      - name: Require a trusted release-signing key
        shell: bash
        run: |
          set -euo pipefail
          n="$(node --input-type=module -e "import('./lib/updater/keys.mjs').then((m) => console.log(m.RELEASE_PUBLIC_KEYS.length))")"
          if [ "$n" -lt 1 ]; then
            echo "::error::lib/updater/keys.mjs trusts no release-signing key. Run 'node scripts/release-signing-keygen.mjs' once, store the private key as the RELEASE_SIGNING_KEY secret of the 'release' environment ('gh secret set RELEASE_SIGNING_KEY --env release < <key file>') and commit lib/updater/keys.mjs."
            exit 1
          fi
          echo "lib/updater/keys.mjs trusts $n release-signing key(s)"

  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # Build every platform even if one fails, so a single flaky OS doesn't
      # block the others. Each matrix leg runs on its own runner in parallel.
      fail-fast: false
      matrix:
        include:
          # macos-26 is Apple Silicon, so the arm64 .dmg builds natively.
          # Pinned (not macos-latest) so the release machine only changes on
          # purpose. GitHub retires old images (macos-14 went on 2026-11-02);
          # move to the next arm64 label when this one is announced for
          # retirement. The macOS the app needs is set by Electron, not by it.
          - os: macos-26
            name: macOS (arm64)
            artifact: mac
          - os: windows-latest
            name: Windows (x64)
            artifact: windows
          - os: ubuntu-latest
            name: Linux (x64)
            artifact: linux
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # Lifecycle scripts stay off; the two things we need from them (the
      # Electron binary download and the node-pty native build) run explicitly.
      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty --foreground-scripts
          node node_modules/electron/install.js
          node scripts/fix-pty-helper.mjs

      - name: Install client dependencies
        run: npm ci --prefix client --ignore-scripts

      # Gate the release on the test suite — never ship a build whose tests fail.
      - name: Run tests
        run: npm test

      - name: Build & package
        # Builds the client, then electron-builder for the host OS with
        # --publish never (Windows: the NSIS installer and the Microsoft Store
        # MSIX); the release and store jobs below publish. The Store identity
        # (name, publisher) comes from repository variables (never stored in
        # the repository; scripts/store-identity.mjs), the publisher display
        # name from package.json; without the variables the MSIX keeps
        # placeholders and the store job refuses it. No GitHub token is
        # exposed here.
        shell: bash
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
        run: |
          npm run build
          node scripts/store-identity.mjs --allow-placeholder --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: k8board-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml

      # Microsoft Store package (MSIX). Unsigned on purpose: the Store
      # signs it with Microsoft's certificate after certification, and it only
      # installs through the Store — so it stays out of the GitHub release
      # (and SHA256SUMS). The `store` job below submits it. Only a package
      # with the Partner Center identity is uploaded: without the repository
      # variables the build writes *-placeholder.msix, which Partner Center
      # rejects, so there is no artifact to download by mistake.
      - name: Upload Microsoft Store package
        if: matrix.artifact == 'windows' && vars.MS_STORE_IDENTITY_NAME != '' && vars.MS_STORE_PUBLISHER != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: store-k8board-windows
          if-no-files-found: error
          retention-days: 30
          path: release/*-windows-store.msix

      - name: No Microsoft Store package without the identity
        if: matrix.artifact == 'windows' && (vars.MS_STORE_IDENTITY_NAME == '' || vars.MS_STORE_PUBLISHER == '')
        shell: bash
        run: echo "::warning::No Microsoft Store package for this release. Set the repository variables MS_STORE_IDENTITY_NAME and MS_STORE_PUBLISHER (Partner Center -> Product management -> Product identity) to build one."

  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Manual approval gate: this job targets the `release` environment, which has
    # required reviewers. After every platform builds, the workflow PAUSES here
    # until a reviewer approves it in the Actions run — then it publishes.
    # (Configure reviewers in Settings → Environments → release.)
    environment: release
    permissions:
      contents: write
      # For actions/attest-build-provenance (best effort, see below).
      id-token: write
      attestations: write
    steps:
      # A short-lived token from the release GitHub App, limited to the public
      # repo. Skipped (PAT fallback below) until the App is configured.
      - name: Release App token
        id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: jaychandra1
          repositories: K8Board
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # The SBOM describes the shipped dependency tree; install it (production
      # deps only, no scripts) so the generator sees resolved packages.
      - name: Install production dependencies for the SBOM
        shell: bash
        run: |
          npm ci --omit=dev --ignore-scripts
          npm ci --prefix client --omit=dev --ignore-scripts

      # Publishing happens on the PUBLIC repo; GITHUB_TOKEN is scoped to this
      # (source) repo only. Fail fast with instructions instead of creating a
      # release in the wrong place.
      - name: Require a publishing token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            echo "Publishing to ${RELEASE_REPO} with the release GitHub App token"
          elif [ -n "${RELEASE_TOKEN:-}" ]; then
            echo "::warning::Publishing with the RELEASE_TOKEN personal access token. Prefer a GitHub App: set the variable RELEASE_APP_CLIENT_ID and the release-environment secret RELEASE_APP_PRIVATE_KEY, then delete RELEASE_TOKEN."
          else
            echo "::error::No publishing token. Either create a GitHub App installed only on ${RELEASE_REPO} with 'Contents: Read and write' and set the repository variable RELEASE_APP_CLIENT_ID plus the 'release' environment secret RELEASE_APP_PRIVATE_KEY, or add a fine-grained personal access token limited to ${RELEASE_REPO} ('Contents: Read and write') as RELEASE_TOKEN."
            exit 1
          fi

      # Fail before touching anything if the signing secret is missing or
      # doesn't match a key the app trusts (lib/updater/keys.mjs).
      - name: Require RELEASE_SIGNING_KEY
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs --check

      - name: Download all build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          # The installers only — not the Store package (store-k8board-windows).
          pattern: k8board-*
          merge-multiple: true

      # Installers are published under the K8Board names only. Copies of the app
      # from before the rename (KubePilot 1.7.3 and older) look for KubePilot-<os>
      # files, so they report "No compatible installer" and link to this page:
      # the release notes tell them to install once by hand.
      - name: Generate SHA256SUMS.txt
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.dmg *.exe *.AppImage *.deb)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no installers found"; exit 1; }
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # SHA256SUMS.txt.sig: Ed25519 over "KubePilot release <version>\n" +
      # SHA256SUMS.txt. The in-app updater installs nothing without it.
      - name: Sign SHA256SUMS.txt
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/sign-release.mjs dist "$VERSION"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/k8board-${{ needs.verify.outputs.tag }}.cdx.json
          artifact-name: k8board-${{ needs.verify.outputs.tag }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Artifact attestations are not available on private repositories without
      # GitHub Enterprise (the persist API returns 404), so this is best effort:
      # it works automatically if the plan ever allows it and never blocks the release.
      - name: Attest build provenance (best effort)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig

      # Release body = the "## [<version>]" section of CHANGELOG.md, with a
      # one-line fallback when that section is missing.
      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ github.sha }}
          SRC: ${{ github.repository }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if [ -s notes.md ]; then
            echo "Using the CHANGELOG.md section for ${VERSION}"
          else
            echo "::warning::CHANGELOG.md has no '## [${VERSION}]' section — using a one-line release body"
            echo "K8Board ${VERSION} — desktop installers for macOS (Apple Silicon), Windows and Linux." > notes.md
          fi
          {
            echo "# K8Board ${VERSION}"
            echo
            cat notes.md
            echo
            echo "---"
            echo
            echo "Checksums are in \`SHA256SUMS.txt\`, signed with K8Board's release key (\`SHA256SUMS.txt.sig\`, verified by the in-app updater); the CycloneDX SBOM is \`k8board-${TAG}.cdx.json\`."
            echo "Container image: \`ghcr.io/jaychandra1/k8board:${TAG}\`."
            echo
            echo "Still on KubePilot 1.7.3 or older? Its updater can't install K8Board releases: download the installer for your system below and run it once. Your clusters and settings are kept, and later updates install from inside the app."
            echo "Built from \`${SRC}@${SHA:0:12}\`."
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: jaychandra1/K8Board
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN }}
          tag_name: ${{ needs.verify.outputs.tag }}
          # No target_commitish: K8Board holds no source, so the tag is created
          # on its default branch (the repo must have at least one commit).
          name: K8Board ${{ needs.verify.outputs.version }}
          draft: false
          make_latest: true
          generate_release_notes: false
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
            dist/*.cdx.json

  # ---------------------------------------------------------------------------
  # Docker image: each architecture is built on a NATIVE runner (no QEMU) and
  # pushed by digest; docker-manifest then tags one multi-arch image.
  #
  # Emulating arm64 with QEMU on an x64 runner made Node crash with SIGILL
  # ("qemu: uncaught target signal 4 (Illegal instruction)") during npm ci —
  # an intermittent fault of the QEMU that setup-qemu-action installs, not of
  # the app. Native arm64 runners (ubuntu-24.04-arm; private repos: billed per
  # minute after the free minutes) also build several times faster.
  docker:
    name: Docker image (${{ matrix.arch }})
    needs: [verify, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Same approval gate as before: both legs wait for the `release`
    # environment together with the GitHub Release job (one approval).
    # They only push untagged digests; nothing is tagged until docker-manifest.
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The image is pushed with GITHUB_TOKEN, so the GHCR packages are created
      # under this (source) repo's owner. After the FIRST push of a name: open
      # the package on GHCR → Package settings → set visibility to Public, and
      # under "Manage Actions access / Connect repository" link it to
      # jaychandra1/K8Board so the public repo shows the image.
      # `k8board` is the image; the same digests are also published as
      # `kubepilot` (the name before the rename) so existing `docker pull`s
      # keep updating. Drop LEGACY once the docs have pointed at k8board for a while.
      - name: Image names
        id: img
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/k8board" >> "$GITHUB_OUTPUT"
          echo "legacy=ghcr.io/${OWNER,,}/kubepilot" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.img.outputs.name }}
          # metadata-action defaults source/url/documentation to the workflow's
          # own (private) repo; point them at the public K8Board repo instead.
          labels: |
            org.opencontainers.image.title=K8Board
            org.opencontainers.image.description=Browse and operate Kubernetes clusters from your kubeconfig — dashboards, logs, shell, topology, Helm, Argo CD, Security Center.
            org.opencontainers.image.source=https://github.com/jaychandra1/K8Board
            org.opencontainers.image.url=https://github.com/jaychandra1/K8Board
            org.opencontainers.image.documentation=https://github.com/jaychandra1/K8Board#readme
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push by digest (${{ matrix.platform }})
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same digest under both names (Docker's multi-runner pattern).
          outputs: type=image,"name=${{ steps.img.outputs.name }},${{ steps.img.outputs.legacy }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
          # Always rebuild the runtime stage, so `apk upgrade` installs the
          # OS security fixes published since the layer was last cached.
          no-cache-filters: runtime

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$DIGEST'"; exit 1; }
          mkdir -p "$DIR"
          touch "$DIR/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  docker-manifest:
    name: Publish Docker image (GHCR)
    # Runs only after both approved, successful architecture builds.
    needs: [verify, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore)
    steps:
      - name: Image names
        id: img
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/k8board" >> "$GITHUB_OUTPUT"
          echo "legacy=ghcr.io/${OWNER,,}/kubepilot" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ steps.img.outputs.name }}
            ${{ steps.img.outputs.legacy }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest

      - name: Create the multi-arch image and push its tags
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGES: ${{ steps.img.outputs.name }} ${{ steps.img.outputs.legacy }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          [ ${#digests[@]} -eq 2 ] || { echo "::error::expected 2 platform digests, got ${#digests[@]}"; exit 1; }
          # One multi-arch manifest per image name, from that name's own digests.
          for image in $IMAGES; do
            mapfile -t tags < <(jq -r --arg img "$image:" '.tags[] | select(startswith($img))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            [ ${#tags[@]} -gt 0 ] || { echo "::error::no tags for $image"; exit 1; }
            args=()
            for t in "${tags[@]}"; do args+=(-t "$t"); done
            sources=()
            for d in "${digests[@]}"; do sources+=("${image}@sha256:${d}"); done
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
          done

      - name: Inspect the published images
        shell: bash
        env:
          IMAGES: ${{ steps.img.outputs.name }} ${{ steps.img.outputs.legacy }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: for image in $IMAGES; do docker buildx imagetools inspect "${image}:${TAG}"; done

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the signature binds the image digest to this workflow's
      # GitHub identity through Sigstore (no key to keep). Signed by digest, so
      # every tag of the image is covered. The certificate names this workflow
      # (repository and ref) and is recorded in Sigstore's public transparency log.
      - name: Sign the images (cosign)
        shell: bash
        env:
          IMAGES: ${{ steps.img.outputs.name }} ${{ steps.img.outputs.legacy }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            digest="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${image}:${TAG}"; exit 1; }
            cosign sign --yes "${image}@${digest}"
            cosign verify "${image}@${digest}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/" >/dev/null
            echo "signed and verified ${image}@${digest}"
          done

  # ---------------------------------------------------------------------------
  # Microsoft Store: submit the MSIX built above as a new submission of the
  # existing Store product, after the GitHub release is published. Off until
  # the repository variable MS_STORE_PRODUCT_ID is set — Microsoft requires
  # the FIRST submission to be made by hand in Partner Center (upload the
  # store-k8board-windows artifact there).
  #
  # Secrets of the `release` environment: MS_STORE_TENANT_ID,
  # MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET — a
  # Microsoft Entra ID app added in Partner Center (Account settings → User
  # management → Microsoft Entra applications) with the Manager role.
  # Certification then takes Microsoft a few days before the update is live.
  store:
    name: Submit to Microsoft Store
    needs: [verify, build, release]
    if: ${{ vars.MS_STORE_PRODUCT_ID != '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The package identity must be the one Partner Center reserved for the
      # product, or the submission is rejected. It lives in repository
      # variables, not in the repository (scripts/store-identity.mjs).
      - name: Require the Partner Center identity
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
        run: |
          foreach ($name in 'MS_STORE_IDENTITY_NAME', 'MS_STORE_PUBLISHER') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              Write-Output "::error::Repository variable $name is not set. Copy Package/Identity/Name and Package/Identity/Publisher from Partner Center (Product management -> Product identity) into MS_STORE_IDENTITY_NAME and MS_STORE_PUBLISHER (Settings -> Secrets and variables -> Actions -> Variables)."
              exit 1
            }
          }

      - name: Download the Store package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: store-k8board-windows
          path: store

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Submit to the Microsoft Store
        shell: pwsh
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              Write-Output "::error::secrets.MS_STORE_$name is not set on the 'release' environment."
              exit 1
            }
          }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem store -Filter *.msix | Select-Object -First 1
          if (-not $pkg) { Write-Output "::error::no .msix in the store-k8board-windows artifact"; exit 1 }
          # The package must carry the Partner Center identity (built with the variables set).
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try { $reader = New-Object IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open()); [xml]$manifest = $reader.ReadToEnd(); $reader.Close() } finally { $zip.Dispose() }
          $identity = $manifest.Package.Identity
          if ($identity.Name -ne $env:MS_STORE_IDENTITY_NAME -or $identity.Publisher -ne $env:MS_STORE_PUBLISHER) {
            Write-Output "::error::The MSIX carries the identity $($identity.Name) / $($identity.Publisher), not the one in the repository variables: it was built before they were set. Run the release again."
            exit 1
          }
          # Partner Center also rejects a publisher display name other than the account's.
          $displayName = (Get-Content package.json -Raw | ConvertFrom-Json).build.appx.publisherDisplayName
          if ($manifest.Package.Properties.PublisherDisplayName -ne $displayName) {
            Write-Output "::error::The MSIX's publisher display name is '$($manifest.Package.Properties.PublisherDisplayName)', not '$displayName' (package.json build.appx.publisherDisplayName). Run the release again."
            exit 1
          }
          msstore publish $pkg.FullName -id $env:PRODUCT_ID
          exit $LASTEXITCODE
