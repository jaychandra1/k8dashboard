name: CI

# Lint, test (with coverage), build, audit and scan on every pull request and
# on pushes to main. Every job here is a gate: a release (release.yml) is only
# built from a main commit whose CI run succeeded, so a CodeQL finding at High
# or Critical, a fixable HIGH/CRITICAL image vulnerability or a committed
# secret blocks the release too (audit BLD-01). Pull requests from branches of this repo run once (the
# pull_request event); the push event is limited to main so a PR merge does
# not fan out into two runs per commit.
#
# Every third-party action is pinned to a full commit SHA (the version is in
# the trailing comment); Dependabot keeps the pins fresh (.github/dependabot.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          # Same arm64 image as the release build (release.yml).
          - os: macos-26
            name: macOS (arm64)
          - os: windows-latest
            name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # --ignore-scripts: no package may run arbitrary code at install time.
      # node-pty is the one native addon we need; it is rebuilt explicitly
      # (Linux has no prebuild) and its spawn-helper exec bit restored, which
      # is what the root postinstall would otherwise do.
      - name: Install root dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty --foreground-scripts
          node scripts/fix-pty-helper.mjs
        shell: bash

      - name: Install client dependencies
        run: npm ci --prefix client --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Server syntax check
        run: node --check server.js

      # The actual gate: a failing test exits non-zero and fails the job.
      # Coverage is reported by node:test's built-in collector.
      - name: Run tests (with coverage)
        run: npm test
        env:
          CI: 'true'

      - name: Client tests (when the client defines a test script)
        run: npm run test:client
        shell: bash

      # Catch build-time breakage (bad import, JSX error) too.
      - name: Build client
        run: npm run build

  # ---------------------------------------------------------------------------
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit client dependencies
        run: npm audit --audit-level=high --prefix client

  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (javascript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # The results are written to codeql-results/ and gated below, so the gate
      # doesn't depend on Code scanning being enabled for the repository.
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          upload: never
          output: codeql-results

      # The gate: High and Critical security findings (security-severity >= 7.0)
      # fail the job; lower ones are printed as warnings. A reviewed false
      # positive is suppressed in the source: a `// codeql[<rule-id>]` comment
      # line, with the reason, directly above the flagged line.
      - name: Fail on High/Critical security findings
        run: node scripts/sarif-gate.mjs codeql-results --min-severity 7.0

      # Uploading needs Code scanning enabled (Settings → Code security and
      # analysis); until then it fails, and that must not fail CI.
      - name: Upload results to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: codeql-results
          category: /language:javascript-typescript

  # ---------------------------------------------------------------------------
  docker:
    name: Docker build, smoke test & image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read # codeql-action/upload-sarif reads the workflow run
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No "build record" artifact: the action names it <owner>~<repo>~<id>.dockerbuild.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: k8board:ci
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The runtime stage's `apk upgrade` never changes, so a cached layer
          # would keep the OS packages from whenever it was first built. This
          # stage is always rebuilt (it's quick); the others stay cached.
          no-cache-filters: runtime

      # Boot the container with an explicit token and a missing kubeconfig,
      # then require /healthz to answer 200 with ok:true.
      - name: Smoke test (/healthz)
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm -p 127.0.0.1:3001:3001 \
            -e K8BOARD_TOKEN=ci-smoke-token -e KUBECONFIG=/nonexistent k8board:ci)
          trap 'docker logs "$cid" || true; docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if body=$(curl -fsS http://127.0.0.1:3001/healthz 2>/dev/null); then
              echo "healthz: $body"
              echo "$body" | grep -q '"ok":true'
              # Auth must be enforced: no token -> 401.
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/config/status)
              [ "$code" = "401" ] || { echo "expected 401 without token, got $code"; exit 1; }
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-smoke-token' http://127.0.0.1:3001/api/config/status)
              [ "$code" = "200" ] || { echo "expected 200 with token, got $code"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy" >&2
          exit 1

      # SARIF for Code scanning (when enabled). The gate is the step at the end.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: k8board:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy results to code scanning
        if: always()
        continue-on-error: true # needs Code scanning enabled on the repo
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif

      # The gate: a HIGH or CRITICAL vulnerability that has a fix fails CI.
      # One that can't be fixed yet goes in .trivyignore.yaml, scoped to the
      # binary it's in, with the reason and an expiry date, never silently.
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: k8board:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

  # ---------------------------------------------------------------------------
  # Committed secrets. On a push or pull request gitleaks scans the new
  # commits; a manual run scans the whole history. Test fixtures (fake keys
  # that exercise the redaction code) are allowed in .gitleaks.toml.
  # gitleaks-action needs no licence key on a personal account; under an
  # organisation it needs the GITLEAKS_LICENSE secret.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the action comments on the offending line of a PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The report holds the findings; keep it out of downloadable artifacts.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
