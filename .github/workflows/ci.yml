name: CI

# Lint, test (with coverage), build, audit and scan on every pull request and
# on pushes to main. Pull requests from branches of this repo run once (the
# pull_request event); the push event is limited to main so a PR merge does
# not fan out into two runs per commit.
#
# Every third-party action is pinned to a full commit SHA (the version is in
# the trailing comment); Dependabot keeps the pins fresh (.github/dependabot.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-14
            name: macOS (arm64)
          - os: windows-latest
            name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # --ignore-scripts: no package may run arbitrary code at install time.
      # node-pty is the one native addon we need; it is rebuilt explicitly
      # (Linux has no prebuild) and its spawn-helper exec bit restored, which
      # is what the root postinstall would otherwise do.
      - name: Install root dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty --foreground-scripts
          node scripts/fix-pty-helper.mjs
        shell: bash

      - name: Install client dependencies
        run: npm ci --prefix client --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Server syntax check
        run: node --check server.js

      # The actual gate: a failing test exits non-zero and fails the job.
      # Coverage is reported by node:test's built-in collector.
      - name: Run tests (with coverage)
        run: npm test
        env:
          CI: 'true'

      - name: Client tests (when the client defines a test script)
        run: npm run test:client
        shell: bash

      # Catch build-time breakage (bad import, JSX error) too.
      - name: Build client
        run: npm run build

  # ---------------------------------------------------------------------------
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit client dependencies
        run: npm audit --audit-level=high --prefix client

  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (javascript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Uploading results requires Code scanning to be enabled for the repository
      # (Settings → Code security and analysis → Code scanning). Until then the
      # analysis still runs but the upload failure must not fail CI.
      - name: Analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript

  # ---------------------------------------------------------------------------
  docker:
    name: Docker build, smoke test & image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read # codeql-action/upload-sarif reads the workflow run
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: k8sight:ci
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the container with an explicit token and a missing kubeconfig,
      # then require /healthz to answer 200 with ok:true.
      - name: Smoke test (/healthz)
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm -p 127.0.0.1:3001:3001 \
            -e K8SIGHT_TOKEN=ci-smoke-token -e KUBECONFIG=/nonexistent k8sight:ci)
          trap 'docker logs "$cid" || true; docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if body=$(curl -fsS http://127.0.0.1:3001/healthz 2>/dev/null); then
              echo "healthz: $body"
              echo "$body" | grep -q '"ok":true'
              # Auth must be enforced: no token -> 401.
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/config/status)
              [ "$code" = "401" ] || { echo "expected 401 without token, got $code"; exit 1; }
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-smoke-token' http://127.0.0.1:3001/api/config/status)
              [ "$code" = "200" ] || { echo "expected 200 with token, got $code"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy" >&2
          exit 1

      # Report-only for now: findings are uploaded to Code scanning (when enabled)
      # and printed below. Flip exit-code back to '1' once the current CRITICAL
      # findings are triaged (fixed, or listed in .trivyignore with a reason).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: k8sight:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Print Trivy findings (human-readable)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: k8sight:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Upload Trivy results to code scanning
        if: always()
        continue-on-error: true # needs Code scanning enabled on the repo
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-image.sarif
