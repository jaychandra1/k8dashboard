# Keep pinned inputs fresh: action SHAs, npm dependencies (root + client) and
# the Docker base image digest. Grouped so routine bumps arrive as a few PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*', '@aws-crypto/*', '@smithy/*']
      dev-tooling:
        dependency-type: development
    ignore:
      # Major Electron bumps change the Chromium/Node baseline; do them by hand.
      - dependency-name: electron
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      client-deps:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
