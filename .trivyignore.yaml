# Trivy findings accepted on purpose. CI fails on any fixable HIGH or CRITICAL
# vulnerability in the Docker image (.github/workflows/ci.yml) unless it is
# listed here.
#
# Each entry is scoped to the one binary it is found in (`paths`), says why it
# is accepted (`statement`), and expires (`expired_at`): after that date CI
# fails on it again, so it gets looked at. Prefer a fix (bump the base image
# digest or the tool's pinned version in the Dockerfile) over an entry.

vulnerabilities:
  # kubectl v1.37.2 is the latest Kubernetes release. It vendors
  # golang.org/x/net v0.57.0 and golang.org/x/text v0.40.0. All three are
  # denial-of-service issues in kubectl, a client K8Board runs only for the
  # pod terminal and port-forward, against the user's own cluster.
  # Remove these when a kubectl release ships x/net >= 0.62.0 and
  # x/text >= 0.41.0 (bump KUBECTL_VERSION in the Dockerfile and run.sh).
  - id: CVE-2026-78661
    paths:
      - usr/local/bin/kubectl
    statement: "golang.org/x/net/html DoS in kubectl; no kubectl release with x/net >= 0.62.0 yet"
    expired_at: 2027-01-31
  - id: CVE-2026-78669
    paths:
      - usr/local/bin/kubectl
    statement: "golang.org/x/net http2 DoS in kubectl; no kubectl release with x/net >= 0.60.0 yet"
    expired_at: 2027-01-31
  - id: CVE-2026-56851
    paths:
      - usr/local/bin/kubectl
    statement: "golang.org/x/text DoS in kubectl; no kubectl release with x/text >= 0.41.0 yet"
    expired_at: 2027-01-31

  # CVE-2026-97054 (GO-2026-6859), Go standard library, fixed in Go 1.26.11 and
  # 1.27.4: an HTTP/1 *server* that uses http.MaxBytesReader can crash when its
  # handler reads the request body while writing the response header.
  #
  # kubelogin (kubectl-oidc_login), the one binary here that serves HTTP (its
  # sign-in callback), is compiled in the Dockerfile with Go 1.26.11: fixed, so
  # it has no entry. The two below are upstream release binaries, and neither
  # project has published a build with the fixed Go yet (checked 2026-11-19:
  # kubectl v1.37.2 and Trivy 0.76.2 are the newest releases). K8Board runs
  # both as one-shot clients, never as a server: kubectl for the pod terminal
  # and port-forward, Trivy as `trivy image …` (trivy-scan.js), so the code
  # the CVE is in does not run.
  # Remove each when its project ships a release built with Go >= 1.26.11 /
  # 1.27.4: bump KUBECTL_VERSION (Dockerfile, run.sh) or TRIVY_VERSION
  # (Dockerfile, trivy-scan.js, scripts/fetch-trivy.mjs, the CI scan).
  - id: CVE-2026-97054
    paths:
      - usr/local/bin/kubectl
    statement: "Go net/http server crash (MaxBytesReader); kubectl runs as a client here; no kubectl release built with Go >= 1.26.11 yet"
    expired_at: 2027-01-31
  - id: CVE-2026-97054
    paths:
      - usr/local/bin/trivy
    statement: "Go net/http server crash (MaxBytesReader); K8Board only runs 'trivy image', never 'trivy server'; no Trivy release built with Go >= 1.27.4 yet"
    expired_at: 2026-12-31
