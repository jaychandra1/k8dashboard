<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- k8Board app icon: a glass tile with a glowing cluster of cubes (a node
       and its workloads) on an orbit. Master artwork; the small sizes use
       k8board-icon-small.svg. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.5" cy="0.48" r="0.55">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <!-- cube faces: lit top, mid left, deep right -->
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3B9BF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rimGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- One cube (centre 0,0, half-height 100): top, left, right faces + edges. -->
    <g id="cube">
      <path d="M0,-100 L86.6,-50 L0,0 L-86.6,-50 Z" fill="url(#top)"/>
      <path d="M-86.6,-50 L0,0 L0,100 L-86.6,50 Z" fill="url(#left)"/>
      <path d="M0,0 L86.6,-50 L86.6,50 L0,100 Z" fill="url(#right)"/>
      <path d="M0,-100 L86.6,-50 L86.6,50 L0,100 L-86.6,50 L-86.6,-50 Z M-86.6,-50 L0,0 L86.6,-50 M0,0 L0,100"
            fill="none" stroke="#E0F2FE" stroke-opacity="0.7" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- tile -->
  <rect x="88" y="88" width="848" height="848" rx="196" fill="url(#tile)"/>
  <rect x="88" y="88" width="848" height="848" rx="196" fill="url(#tileGlow)"/>
  <rect x="88" y="88" width="848" height="848" rx="196" fill="url(#sheen)"/>
  <rect x="91" y="91" width="842" height="842" rx="193" fill="none" stroke="url(#rim)" stroke-width="8" filter="url(#rimGlow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- orbit: three arcs between the satellites (at -90°, 30°, 150°, r = 300 around 512,530) -->
  <g fill="none" stroke="url(#orbit)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" opacity="0.95">
    <path d="M 638.8 258.1 A 300 300 0 0 1 810.9 556.1"/>
    <path d="M 684.1 775.7 A 300 300 0 0 1 339.9 775.7"/>
    <path d="M 213.1 556.1 A 300 300 0 0 1 385.2 258.1"/>
  </g>

  <!-- links from the centre cube to the satellites -->
  <g stroke="#7DD3FC" stroke-width="12" stroke-linecap="round" filter="url(#glow)" opacity="0.9">
    <line x1="512" y1="400" x2="512" y2="318"/>
    <line x1="625" y1="595" x2="694" y2="636"/>
    <line x1="399" y1="595" x2="330" y2="636"/>
  </g>

  <!-- satellites -->
  <g filter="url(#glow)">
    <use href="#cube" transform="translate(512 236) scale(0.74)"/>
    <use href="#cube" transform="translate(772 680) scale(0.74)"/>
    <use href="#cube" transform="translate(252 680) scale(0.74)"/>
  </g>
  <!-- centre cube -->
  <g filter="url(#softGlow)">
    <use href="#cube" transform="translate(512 530) scale(1.5)"/>
  </g>
</svg>
