<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- K8Board icon for 16–48 px (taskbar, tray, favicon, small tiles): the same
       tile and cube, without the glow, orbit and satellites that blur at this
       size. -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3B9BF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#t)"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#r)" stroke-width="2"/>
  <g transform="translate(32 32.5) scale(0.25)">
    <path d="M0,-100 L86.6,-50 L0,0 L-86.6,-50 Z" fill="url(#top)"/>
    <path d="M-86.6,-50 L0,0 L0,100 L-86.6,50 Z" fill="url(#left)"/>
    <path d="M0,0 L86.6,-50 L86.6,50 L0,100 Z" fill="url(#right)"/>
  </g>
</svg>
