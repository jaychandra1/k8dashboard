<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>K8Board</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000000;
        color: #e2e8f0;
        font-family: "Proxima Nova", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      /* The mark: a glass tile in the brand's blues with a white helm turning in
         it, as on the app's own loading screen (components/shell/LoadingScreen).
         Drawn here, so the page loads nothing. */
      .mark {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 6px;
        display: grid;
        place-items: center;
        border: 1.5px solid transparent;
        border-radius: 26px;
        color: #fff;
        background:
          linear-gradient(150deg, #2563eb 0%, #1e3a8a 48%, #4c1d95 100%) padding-box,
          linear-gradient(135deg, #7dd3fc, #3b82f6 50%, #a78bfa) border-box;
        box-shadow: 0 14px 34px -12px rgba(59, 130, 246, 0.65), 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      .mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 46%);
      }
      .mark::after {
        content: "";
        position: absolute;
        inset: -9px;
        border-radius: 34px;
        border: 1px solid rgba(96, 165, 250, 0.55);
        opacity: 0;
        animation: halo 2.6s ease-out infinite;
      }
      .wheel {
        position: relative;
        z-index: 1;
        animation: spin 7s linear infinite;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.28));
        will-change: transform;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes halo {
        0%   { transform: scale(0.94); opacity: 0.6; }
        100% { transform: scale(1.14); opacity: 0; }
      }
      .title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
      /* The wordmark: "K", a small "8", "Board" (as in the app's sidebar). */
      .title .eight { font-size: 0.66em; margin: 0 0.03em 0 0.02em; letter-spacing: 0; }
      .sub { font-size: 13px; color: #94a3b8; }
      .bar {
        width: 200px; height: 3px; border-radius: 3px;
        background: rgba(148,163,184,0.2); overflow: hidden;
      }
      .bar::after {
        content: ""; display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, #38bdf8, #3b82f6 55%, #a78bfa); border-radius: 3px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      /* Reduce motion: the turning helm and its ring are decoration; the bar shows progress. */
      @media (prefers-reduced-motion: reduce) {
        .wheel, .mark::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">
        <svg class="wheel" viewBox="0 0 100 100" width="56" height="56" fill="none" stroke="currentColor" stroke-linecap="round">
          <circle cx="50" cy="50" r="27" stroke-width="8" />
            <line x1="50.00" y1="37.00" x2="50.00" y2="6.00" stroke-width="7" />
            <line x1="60.16" y1="41.89" x2="84.40" y2="22.57" stroke-width="7" />
            <line x1="62.67" y1="52.89" x2="92.90" y2="59.79" stroke-width="7" />
            <line x1="55.64" y1="61.71" x2="69.09" y2="89.64" stroke-width="7" />
            <line x1="44.36" y1="61.71" x2="30.91" y2="89.64" stroke-width="7" />
            <line x1="37.33" y1="52.89" x2="7.10" y2="59.79" stroke-width="7" />
            <line x1="39.84" y1="41.89" x2="15.60" y2="22.57" stroke-width="7" />
          <circle cx="50" cy="50" r="7.5" stroke-width="6" />
        </svg>
      </div>
      <div class="title">K<span class="eight">8</span>Board</div>
      <div class="bar"></div>
      <div class="sub">Starting the backend…</div>
    </div>
  </body>
</html>
