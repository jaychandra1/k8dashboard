    <title>KubePilot</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000000;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      .title { font-size: 18px; font-weight: 600; letter-spacing: 0.2px; }
      .sub { font-size: 13px; color: #94a3b8; }
      .bar {
        width: 180px; height: 3px; border-radius: 3px;
        background: rgba(148,163,184,0.2); overflow: hidden;
      }
      .bar::after {
        content: ""; display: block; height: 100%; width: 40%;
        background: #e6e6ea; border-radius: 3px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
